# .github/workflows/ci.yml
# Required status check for the main branch (Pitfall 0-F).
# Six jobs: move, ts, python, codegen-drift, parity, e2e-vault.
#
# Plan 02-09 added the 6th job e2e-vault (VAULT-11). Branch protection
# rules in repo settings need updating to add e2e-vault as a required
# status check.
#
# parity is the gate the whole project hangs on:
#   Phase 1 (MATH-05) wires three-runtime cross-check:
#     - Python parity_runner: deepvault.svi vs shared/golden-vectors.json
#     - TypeScript parity_runner: dashboard/src/lib/svi.ts vs same JSON
#     - Move svi_view_tests::golden_vectors_*: deepvault::svi_view vs Move companion
#     - Forbidden-token grep on dashboard/src/lib/{math,isqrt,phi,ln,svi}.ts
#   Stays green forever after; if it goes red, halt feature work.
#
# e2e-vault runs the per-push hermetic Move integration suite
# (`sui move test --filter integration_test`) via
# scripts/e2e-vault-cycle.sh with FAST_FORWARD=1. The real-testnet
# variant (1h cooldown wait) lives in nightly-e2e-vault.yml.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  move:
    name: Move tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — verify-deepbookv3-pin.sh greps the subtree squash commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Sui CLI (mainnet-v1.71.1)
        run: |
          set -euo pipefail
          SUI_VERSION="mainnet-v1.71.1"
          # Try the canonical Linux x86_64 tarball naming pattern from RESEARCH.md A6.
          # If asset name evolves, update here and regenerate ci.yml.
          ASSET="sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          URL="https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/${ASSET}"
          echo "Downloading ${URL}"
          curl -fsSL "${URL}" -o /tmp/sui.tgz
          mkdir -p "$HOME/.sui/bin"
          tar -xzf /tmp/sui.tgz -C "$HOME/.sui/bin"
          echo "$HOME/.sui/bin" >> "$GITHUB_PATH"

      - name: Verify Sui version
        run: sui --version

      - name: Verify DeepBookV3 SHA pin alignment (Pitfall 6)
        run: bash scripts/verify-deepbookv3-pin.sh

      - name: Move build
        working-directory: contracts
        run: sui move build

      - name: Move test with coverage (VAULT-09 gate)
        working-directory: contracts
        run: sui move test --gas-limit 100000000000 --coverage

      - name: Coverage gate (>= 85% on supply/redeem/rebalance) [VAULT-09]
        # SOFT-FAIL until Phase 3 integration tests land.
        # Plan 02-08 SUMMARY pre-flagged the gap: supply/rebalance paths
        # need a live PredictManager fixture to exercise predict::mint /
        # predict::redeem code paths. Plan 03-06 (replay parity) + Plan
        # 03-09 (e2e report) will lift coverage past 85%. Re-arm to
        # hard-fail in Plan 03-09 by removing continue-on-error here.
        continue-on-error: true
        working-directory: contracts
        run: bash tests/coverage_check.sh

      - name: Move tests (Phase 3 -- mock_margin_pool + ptb_capability_test + liquidation_test)
        # Plan 03-09 W1 sub-task 3b: smoke-checks for Phase 3 Move tests.
        # Filter is positional in sui CLI 1.71.1 (NOT --filter). Tests gracefully
        # report 0 cases on plans not yet landed; survives partial-wave landing.
        # --skip-fetch-latest-git-deps was removed in Sui CLI 1.71.1 (fetch is
        # automatic); regression caught post-Plan-03-09 and dropped here.
        working-directory: contracts
        run: |
          set -euo pipefail
          sui move test --gas-limit 100000000000 mock_margin_pool
          sui move test --gas-limit 100000000000 ptb_capability_test
          sui move test --gas-limit 100000000000 liquidation_test
          echo "==> Phase 3 Move tests: PTB-04 + PTB-05 + mock_margin_pool PASS"

      - name: Capability containment grep (VAULT-10 + PTB-04 Margin-side extension)
        # W4 lock (Plan 02-07): this grep is the LOAD-BEARING enforcement
        # of the capability-containment property for VAULT-10. The
        # contracts/specs/capability_containment.move file is a
        # documentation_anchor() stub only.
        #
        # Plan 03-09 W1 sub-task 3b extends this step with PTB-04 Margin-side
        # checks: TradeCap / MarginManager / MockMarginPool must never be
        # returned from a public production function, and scripts/*.ts must
        # not extract a free TradeCap binding outside the SDK layer.
        #
        # Pattern detail (VAULT-10 base):
        #   - Main regex `\)\s*:\s*\&?(mut )?(TreasuryCap|AdminCap)`
        #     anchors on the return-type position (`)` followed by `:`)
        #     so parameter annotations like `cap: AdminCap` are NOT
        #     flagged. Only functions that RETURN the cap are flagged.
        #   - First filter excludes `_test.move` test fixtures.
        #   - Second filter excludes `public(package) fun` callsites
        #     (intra-package borrowing of TreasuryCap is fine — supply
        #     and redeem legitimately need `&mut TreasuryCap<SHARE>`
        #     via `vault::treasury_cap_mut`). Anchor is `public(package) fun`
        #     anywhere on the line (NOT `^\s*public(package)` which
        #     fails to match the `file:line:` prefix that grep -n emits).
        run: |
          set -euo pipefail
          # VAULT-10 base check (Phase 2)
          if grep -nE '\)\s*:\s*\&?(mut )?(TreasuryCap|AdminCap)' \
              contracts/sources/*.move 2>/dev/null \
              | grep -v '_test.move' \
              | grep -vE 'public\(package\) fun'; then
            echo "::error::VAULT-10: Capability containment violated — a public function exposes TreasuryCap or AdminCap by reference."
            exit 1
          fi
          # PTB-04 Margin-side (Phase 3) — TradeCap / MarginManager / MockMarginPool
          # never returned by value from production sources.
          if grep -nE '^public fun .*: \&?(mut )?(TradeCap|MarginManager|MockMarginPool)' \
              contracts/sources/*.move 2>/dev/null \
              | grep -v '_test.move'; then
            echo "::error::PTB-04: deepvault production module exposes Margin capability"
            exit 1
          fi
          # PTB-04 TS demo — no free TradeCap binding outside SDK layer.
          if grep -nE '^\s*(const|let)\s+(tradeCap|trade_cap|withdrawCap)\s*=' \
              scripts/*.ts 2>/dev/null \
              | grep -v 'node_modules'; then
            echo "::error::PTB-04: TS demo extracts Margin capability outside SDK layer"
            exit 1
          fi
          echo "Capability containment OK: no production module exposes TreasuryCap/AdminCap/TradeCap/MarginManager/MockMarginPool."

  ts:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # version comes from packageManager: pnpm@10.0.0 in package.json
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit || true   # Phase 0 placeholders have no tsconfig; tighten in Phase 4

      - name: Test
        run: pnpm -r run test

  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backtest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        # Pinned to exact v8.1.0 — astral-sh/setup-uv doesn't publish a
        # floating v8 major tag, so `@v8` fails to resolve at runner setup.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: 'backtest/uv.lock'

      - name: Install (locked)
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        # -v surfaces failing test names; on failure, emit `::error::`
        # markers per FAILED line so the check-run annotations API
        # picks them up (visible without log-read auth).
        run: |
          set +e
          uv run pytest -v --tb=short 2>&1 | tee /tmp/pytest.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "::group::Pytest failure summary"
            grep -E "^FAILED|^ERROR" /tmp/pytest.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::endgroup::"
            echo "::group::Last 80 lines of pytest output"
            tail -80 /tmp/pytest.log
            echo "::endgroup::"
          fi
          exit "$EXIT"

      - name: 7-day micro-fixture replay parity (BACK-04 per-push gate)
        # Plan 03-09 W1 sub-task 3a: explicit log step for the 7-day micro-
        # fixture trace-replay parity check. `uv run pytest` (above) already
        # exercises the same test as part of the full suite; this step makes
        # the planner-critical per-push gate readable in the CI log.
        run: |
          set -euo pipefail
          uv run pytest tests/test_replay_parity.py -x --tb=short
          echo "==> 7-day micro-fixture parity: BACK-04 gate PASS"

      - name: PTB capability grep (Phase 3 PTB-04 cross-language)
        # Plan 03-09 W1 sub-task 3a: wires Plan 03-05's deferred grep gate
        # into per-push CI. Cross-language assertion that no TradeCap /
        # MarginManager / MockMarginPool capability escapes from production
        # Move OR scripts/*.ts surfaces.
        run: |
          set -euo pipefail
          uv run pytest tests/test_ptb_capability_grep.py -x --tb=short
          echo "==> PTB capability grep: PTB-04 gate PASS"

  codegen-drift:
    name: Codegen drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        # Pinned to exact v8.1.0 — astral-sh/setup-uv doesn't publish a
        # floating v8 major tag, so `@v8` fails to resolve at runner setup.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: 'backtest/uv.lock'

      - name: Sync backtest env (provides Python 3.12 + tomli for codegen)
        working-directory: backtest
        run: uv sync --frozen

      - name: Regenerate constants
        run: |
          cd backtest && uv run --no-project python ../scripts/codegen.py

      - name: Regenerate golden vectors
        run: |
          cd backtest && uv run --no-project python ../scripts/golden_emit.py

      - name: Verify no drift
        run: |
          if ! git diff --exit-code --stat \
              contracts/sources/strategy_constants.move \
              backtest/src/deepvault/strategy_constants.py \
              dashboard/src/lib/strategy_constants.ts \
              contracts/sources/phi_coefficients.move \
              backtest/src/deepvault/phi_coefficients.py \
              dashboard/src/lib/phi_coefficients.ts \
              shared/golden-vectors.json \
              contracts/tests/golden_vectors_data.move; then
            echo "::error::generated files out of sync — run 'make codegen' AND 'python scripts/golden_emit.py' locally and commit the regenerated files. See CONTRIBUTING.md §'Editing generated code' and §6 (MATH: prefix for SVI math changes)."
            exit 1
          fi

  parity:
    name: parity
    runs-on: ubuntu-latest
    needs: [move, ts, python, codegen-drift]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Install Sui CLI (mainnet-v1.71.1) — copy from `move` job
      # ============================================================
      - name: Install Sui CLI (mainnet-v1.71.1)
        run: |
          set -euo pipefail
          SUI_VERSION="mainnet-v1.71.1"
          ASSET="sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          URL="https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/${ASSET}"
          curl -fsSL "${URL}" -o /tmp/sui.tgz
          mkdir -p "$HOME/.sui/bin"
          tar -xzf /tmp/sui.tgz -C "$HOME/.sui/bin"
          echo "$HOME/.sui/bin" >> "$GITHUB_PATH"

      - name: Verify Sui version
        run: sui --version

      # ============================================================
      # Install Node 22 + pnpm — copy from `ts` job
      # ============================================================
      - name: Install pnpm
        # version comes from packageManager: pnpm@10.0.0 in package.json
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # ============================================================
      # Install uv + sync backtest env — copy from `python` job
      # ============================================================
      - name: Install uv
        # Pinned to exact v8.1.0 — astral-sh/setup-uv doesn't publish a
        # floating v8 major tag, so `@v8` fails to resolve at runner setup.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: 'backtest/uv.lock'

      - name: Sync backtest env
        working-directory: backtest
        run: uv sync --locked --all-extras --dev

      # ============================================================
      # Phase 1 (MATH-05): three-way parity assertion
      # ============================================================
      - name: Forbidden-token grep on TS evaluator (Pitfall B)
        run: |
          set -euo pipefail
          if grep -nE "Number\(|parseFloat\(|Math\.(sqrt|exp|log|pow)\(" \
              dashboard/src/lib/math.ts \
              dashboard/src/lib/isqrt.ts \
              dashboard/src/lib/phi.ts \
              dashboard/src/lib/ln.ts \
              dashboard/src/lib/svi.ts; then
            echo "::error::Forbidden token found in dashboard/src/lib/{math,isqrt,phi,ln,svi}.ts. See CONTRIBUTING.md §6 (MATH: prefix) and shared/svi-spec.md §2 — TS evaluator must use bigint only."
            exit 1
          fi

      - name: Python parity runner
        working-directory: backtest
        run: uv run python -m deepvault.parity_runner

      - name: TypeScript parity runner
        working-directory: dashboard
        run: pnpm exec tsx src/lib/parity_runner.ts

      - name: Move golden vectors test
        # `sui move test` takes the filter as a positional arg, not --filter.
        # The --filter form was renamed in a recent Sui CLI release; the
        # mainnet-v1.71.1 binary uses the positional form.
        working-directory: contracts
        run: sui move test --gas-limit 100000000000 golden_vectors

      - name: Move full test suite (sanity)
        working-directory: contracts
        run: sui move test --gas-limit 100000000000

      - name: Parity gate summary
        run: |
          echo "Phase 1 MATH-05 parity gate green"
          echo "  - Python parity_runner: pass"
          echo "  - TypeScript parity_runner: pass"
          echo "  - Move svi_view_tests::golden_vectors_*: pass"
          echo "  - Forbidden-token grep on TS evaluator: clean"

  e2e-vault:
    name: E2E vault cycle (Move integration; FAST_FORWARD=1)
    runs-on: ubuntu-latest
    needs: [move, parity]
    steps:
      - uses: actions/checkout@v4

      - name: Install Sui CLI (mainnet-v1.71.1)
        run: |
          set -euo pipefail
          SUI_VERSION="mainnet-v1.71.1"
          ASSET="sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          URL="https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/${ASSET}"
          curl -fsSL "${URL}" -o /tmp/sui.tgz
          mkdir -p "$HOME/.sui/bin"
          tar -xzf /tmp/sui.tgz -C "$HOME/.sui/bin"
          echo "$HOME/.sui/bin" >> "$GITHUB_PATH"

      - name: Verify Sui version
        run: sui --version

      - name: Run E2E vault cycle (FAST_FORWARD=1, hermetic)
        env:
          FAST_FORWARD: "1"
        run: bash scripts/e2e-vault-cycle.sh
