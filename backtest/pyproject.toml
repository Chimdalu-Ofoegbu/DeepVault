# backtest/pyproject.toml
# Python project for DeepVault backtest harness (Phase 1+ math, Phase 3 harness).
# Pinned per .planning/phases/00-setup-ground-rules/00-RESEARCH.md Pattern 2 + Standard Stack.

[project]
name = "deepvault-backtest"
version = "0.1.0"
description = "DeepVault Python backtest harness (SVI eval, vault state replay, lookahead audit)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DeepVault solo builder" }]
dependencies = [
  "jinja2>=3.1.6",
  "matplotlib>=3.9",
  "numpy>=2.4",
  "pandas>=2.2",
  "plotly>=5.20",
  "pyarrow>=18",
  "requests>=2.32",
  "scipy>=1.14",
]

[dependency-groups]
dev = [
  "beautifulsoup4>=4.12",
  "pytest>=8.3",
  "pytest-cov",
  "ruff",
  "tomli-w>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepvault"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Codegen outputs are emitted byte-equal by scripts/codegen.py and verified
# bit-equal by CI's codegen-drift job. Excluding them from ruff format/lint
# prevents ruff from rewriting the codegen output and tripping drift.
extend-exclude = [
  "src/deepvault/strategy_constants.py",
  "src/deepvault/phi_coefficients.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
