# config/mainnet.toml
# Mainnet runtime configuration scaffold for DeepVault.
#
# DO NOT publish to mainnet until every TBD value below is filled.
# Phase 5 preflight script (scripts/preflight.sh) refuses to proceed
# while any required field equals "TBD".
#
# Schema is identical to config/testnet.toml (Pitfall 14 mitigation).

schema_version = 1

[network]
name = "mainnet"
sui_rpc_url = "https://fullnode.mainnet.sui.io:443"
sui_ws_url = ""
# Mainnet Predict server URL not yet announced as of Phase 0 (per CLAUDE.md Stack notes).
# Verify shape (https://predict-server.mainnet.mystenlabs.com expected) in Phase 5 spike before publish.
predict_server_url = "TBD"

[predict]
# Predict mainnet addresses: pin in Phase 5 once Predict ships on mainnet.
# If Predict mainnet has NOT shipped by 2026-06-09, switch to fallback per DEPLOY-09 / D-09.
package_id = "TBD"
registry_id = "TBD"
top_level_shared_object_id = "TBD"
plp_type_tag = "TBD"

[deepbook_margin]
# Margin mainnet addresses: pin in Phase 5
package_id = "TBD"
margin_pool_id = "TBD"

[oracle_svi]
event_module_full = "TBD::oracle_svi::OracleSVIUpdated"
poll_interval_ms = 2000

[assets]
# USDsui mainnet, 6 decimals (per CONTEXT.md D-08, acquired via Cetus swap)
quote_type_tag = "TBD"               # 0x{USDSUI_PACKAGE}::usdsui::USDSUI, verify in Phase 5
quote_decimals = 6
btc_oracle_type_tag = "TBD"

[deepvault]
# Filled by Phase 5 publish step
package_id = "TBD"
vault_shared_object_id = "TBD"
admin_cap_id = "TBD"
treasury_cap_holder = "TBD"          # mainnet deploy wallet address (per CONTEXT.md D-06)
deploy_tx_digest = "TBD"             # captured from sui client publish output

[hosting]
# Per CONTEXT.md D-13 (Vercel default subdomain), D-15 (Render free tier), D-16 (no custom domain)
dashboard_url = "TBD"                # https://<slug>.vercel.app, filled Phase 4
relay_url = "TBD"                    # wss://<slug>.onrender.com, filled Phase 4
relay_keepalive_path = "/healthz"

[contingency]
# DEPLOY-09 per CONTEXT.md: if Predict mainnet has not shipped by 2026-06-09,
# fall back to "vault + Margin path on mainnet, testnet-only Predict path".
# Phase 5 sets predict_mainnet_shipped = true on the day-of if Predict mainnet is live.
predict_mainnet_shipped = false
fallback_documented_in = "docs/MAINNET-FUNDING.md"
