# contracts/Move.toml
# Sui Move package for the DeepVault structured product.
# Pinned per .planning/phases/00-setup-ground-rules/00-RESEARCH.md Pattern 3.

[package]
name = "deepvault"
version = "0.1.0"
edition = "2024.beta"
authors = ["DeepVault solo builder"]

[dependencies]
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "framework/mainnet", override = true }
MoveStdlib = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/move-stdlib", rev = "framework/mainnet", override = true }

# DeepBookV3 — predict-testnet-4-16 branch SHA-pinned per Pitfall 0-A.
# Bump only after a Monday Predict sweep triages the diff (see scripts/predict-diff.sh, Plan 05).
# SHA captured 2026-05-09 from `git ls-remote https://github.com/MystenLabs/deepbookv3.git predict-testnet-4-16`.
deepbook = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/deepbook", rev = "1159d79af33c70e09e406310e1d8f067832ede9d" }

# DeepBook Predict — same SHA, different subdir.
# Required so contracts/sources/svi_view.move (`use deepbook_predict::oracle`)
# and contracts/tests/_spike/predict_manager_owner_spike_test.move resolve.
# Plan 02-01 Rule-3 auto-fix: Phase 1 added the import but not the dep, so
# `sui move build` would have failed in CI on first run.
#
# published-at MUST be set so Sui CLI knows Predict is already deployed on testnet
# and treats this as a linked-not-published dep. Without it, `sui client publish`
# refuses with "Unpublished dependencies: deepbook_predict". This is the testnet
# package id from CLAUDE.md Stack Pins (mirrors the `predict` named-address below).
# Phase 5 mainnet-deploy.sh swaps in the mainnet address when Predict ships.
deepbook_predict = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/predict", rev = "1159d79af33c70e09e406310e1d8f067832ede9d", published-at = "0xf5ea2b3749c65d6e56507cc35388719aadb28f9cab873696a2f8687f5c785138" }

[addresses]
deepvault = "0x0"
# Predict testnet package — from CLAUDE.md Stack Pins (Phase 5 swaps in mainnet address)
predict   = "0xf5ea2b3749c65d6e56507cc35388719aadb28f9cab873696a2f8687f5c785138"
sui       = "0x2"
std       = "0x1"
clock     = "0x6"

[dev-dependencies]
# Empty for Phase 0; Phase 1+ may add test-only deps
