# shared/strategy.toml
# Single source of truth for cross-runtime constants.
# Edit this file, then run `make codegen` to regenerate the three constants files:
#   - contracts/sources/strategy_constants.move
#   - backtest/src/deepvault/strategy_constants.py
#   - dashboard/src/lib/strategy_constants.ts
#
# DO NOT edit the generated files directly — they are overwritten on next codegen.
# CI's `codegen-drift` job (Plan 07) fails the build if generated files are out of sync.

schema_version = 2
last_updated = "2026-05-10"

[fixed_point]
# All on-chain math is fixed-point; document the scale here.
decimals = 18                       # standard for prices / NAV-per-share
variance_decimals = 27              # higher precision for SVI total variance
share_decimals = 9                  # vault share decimals (Sui Coin convention)

[hedge_policy]
# LOCKED per CONTEXT.md D-01..D-04 (Phase 0 commit, before backtest opens).
# Re-tunable ONLY in Phase 3 backtest on out-of-sample-aware walk-forward analysis.
# After Phase 3 close, FROZEN PERMANENTLY (see CONTRIBUTING.md §"Hedge-ratio policy is locked").
allocation_bps = 1000               # D-01: 10% of new deposit (10000 bps = 100%)
strike_otm_bps = 1500               # D-02: -15% OTM
tenor_seconds = 1209600             # D-03: 14 days = 14 * 86400
roll_trigger_seconds = 172800       # D-03: roll when expiry < 2 days = 2 * 86400
sizing_function = "fixed"           # D-04: v1 fixed; "dynamic" reserved for v2 swap
max_price_premium_bps = 50          # Plan 02-02: vault refuses predict::mint if Predict ask > SVI fair value by >0.5% (RESEARCH.md Pitfall 2)

[token_bucket]
# Absolute u64 micro-units — matches deepvault::helpers::rate_limiter.move
# (cloned from vendored Predict at SHA 1159d79a). Per CONTEXT.md D-05:
# AdminCap can retune these at runtime via admin_tune_strategy.
# Defaults are conservative — full bucket regenerates over 24h.
capacity_quote_micro_units = 100_000_000          # 100 DUSDC at 6dp
refill_rate_quote_micro_units_per_ms = 1200       # ~= capacity / 24h in ms

[inflation_defense]
# OpenZeppelin ERC-4626 v5 inflation-attack defense ports. Consumed by
# vault::create_vault (seed) and vault::supply (virtual_shares offset).
# See CONTEXT.md "Claude's Discretion" -> "Inflation defense seed amount".
seed_quote_micro_units = 10_000_000               # 10 DUSDC at 6dp
virtual_shares = 1_000_000                         # 10^6 = decimals_offset

[ltv]
# Worst-case haircut bounds — Phase 3 PTB-05 (-30% NAV shock liquidation test) validates.
margin_ltv_cap_bps = 5000                       # 50% defensive cap (below Margin's recommended 55%)
worst_case_settlement_haircut_bps = 10000       # 100% — assume full Predict adverse outcome

[oracle]
max_staleness_seconds = 300         # 5 min; vault refuses supply/rebalance if exceeded

[redemption]
# 1-hour cooldown between redeem_request and redeem_fulfill (D-01 of Phase 2).
# Single source of truth for the on-chain redeem.move gate AND the testnet-smoke-test wait.
# Plan 05-04 extracted this from contracts/sources/redeem.move const COOLDOWN_MS.
cooldown_ms = 3_600_000   # 1 hour = 60 * 60 * 1000

[svi]
# LOCKED per re-routed D-01, D-10, D-13, D-14 (CONTEXT.md "Re-routes from RESEARCH.md (2026-05-09)").
# Math layer matches on-chain Predict — see shared/svi-spec.md.
# Re-tunable ONLY via MATH: commit-prefix (CONTRIBUTING.md §6) with paired svi-spec.md update.
parameterization = "raw_svi_5param"            # re-route D-01: matches OracleSVIUpdated event struct
scale = 9                                      # re-route D-10: FLOAT_SCALING = 1e9 (matches deepbook_predict::constants::float_scaling)
grid_points_for_arb_check = 200                # MATH-04: ≥200-point g(k) grid scan
strike_range_sigma = 4                         # MATH-04: ±4σ around spot for arb scan
k_max_log_strike = 2_500_000_000               # max safe input domain at 1e9 → ±2.5; svi-spec.md §3
# Per-param permissive bounds for raw SVI (a, b, rho, m, sigma) — matches Predict's on-chain
# acceptance envelope. Phase 1 svi_view enforces these as hard pre-conditions.
a_max     = 4_000_000_000                      # max ATM total variance ≈ 400% annualized; sane upper bound
b_max     = 8_000_000_000                      # smile-wing slope; permissive
sigma_min = 1                                  # > 0 strict; on-chain asserts non-zero
sigma_max = 4_000_000_000                      # ATM curvature; permissive
m_abs_max = 2_500_000_000                      # |m| ≤ 2.5 at 1e9; matches k bound
# rho is signed in (-F, +F); abs bound enforced as |rho| < F = 1_000_000_000 directly in svi_view.

[meta]
btc_decimals = 8
quote_decimals = 6                  # USDsui mainnet, dUSDC testnet
